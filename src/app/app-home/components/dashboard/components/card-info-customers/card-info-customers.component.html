<div class="card-info-customers">
  <h2>Destaques</h2>
  <h4>Clientes top 3</h4>
  <div class="card-info-customers__container-accordion">
    <p-accordion *ngIf="topClients.length > 0, else noClients">
      <p-accordionTab
        *ngFor="let client of topClients; let i = index"
        header="{{ i + 1 }}º {{ client.name }}"
      >
        <div class="card-info-customers__container-content-accordion">
          <h4>
            <span>Empresa:</span> {{ client.companyValuation | shortCurrency }}
          </h4>
          <h4><span>Salário:</span> {{ client.salary | shortCurrency }}</h4>
        </div>
      </p-accordionTab>
    </p-accordion>
    <ng-template #noClients>
      <div class="card-info-customers__container-noclients">
        <h4>Sem informações</h4>
      </div>
    </ng-template>
  </div>
</div>
